services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: gradeflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gradeflow_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradeflow_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/gradeflow_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
